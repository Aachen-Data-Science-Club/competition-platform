version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./adsc.db
      - SECRET_KEY=change-me-to-a-random-secret
      - ADMIN_ACCESS_CODE=admin-secret-code

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adsc-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend