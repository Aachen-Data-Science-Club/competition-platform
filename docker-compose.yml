version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
      - DATA_DIR=/app/data
      - TZ=Europe/Berlin

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adsc-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  evaluator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsc-evaluator
    command: python ml/evaluator.py
    depends_on:
      - backend
    volumes:
      - ./backend:/app
      - ./data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
      - DATA_DIR=/app/data
      - TZ=Europe/Berlin