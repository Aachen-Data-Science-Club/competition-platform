version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsc-backend-prod
    restart: always
    #ports:
     # - "8000:8000"
    volumes:
      # In production, we only mount the data directory, NOT the source code
      - ./data:/app/data
      - prod_db:/app/db # Dedicated volume for SQLite DB (if still using SQLite)
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      # In prod, you'd ideally use PostgreSQL (e.g. DATABASE_URL=postgresql://user:pass@db:5432/adsc)
      # But sticking to SQLite in a volume for simplicity here:
      - DATABASE_URL=sqlite:////app/db/adsc.db
      - DATA_DIR=/app/data
      - TZ=Europe/Berlin
      - FORWARDED_ALLOW_IPS=*
      - CORS_ORIGINS=https://competition.data-science-club.de,https://competition.data-science-club.com
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"] # No --reload in prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: adsc-frontend-prod
    restart: always
    #ports:
     # - "80:80" # Exposed on port 80 instead of 5173
    depends_on:
      - backend

  evaluator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsc-evaluator-prod
    restart: always
    depends_on:
      - backend
    volumes:
      - ./data:/app/data
      - prod_db:/app/db
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/db/adsc.db
      - DATA_DIR=/app/data
      - TZ=Europe/Berlin
    command: ["python", "ml/evaluator.py"]

  caddy:
    image: caddy:latest
    container_name: adsc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  prod_db:
  caddy_data:
  caddy_config: